[workspace]
members = ["crates/tik-core", "crates/tik-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"

[workspace.dependencies]
anyhow = "1.0.82"
clap = "4.5.4"
clap_complete = "4.5.2"
console = "0.15.8"
crossterm = "0.27.0"
csv = "1.3.0"
dialoguer = "0.11.0"
filetime = "0.2.27"
fs4 = "0.9.1"
ignore = "0.4.22"
is-terminal = "0.4.12"
jsonschema = "0.17.1"
pager = "0.16.1"
ratatui = "0.26.3"
rusqlite = { version = "0.31.0", features = ["bundled-full", "modern_sqlite"] }
semver = "1.0.22"
similar = "2.4"
serde = "1.0.197"
serde_json = "1.0.115"
serde_yaml = "0.9.34"
shell-words = "1.1.0"
tabled = "0.15.0"
tempfile = "3.10.1"
thiserror = "1.0.58"
time = { version = "0.3.36", features = ["serde", "formatting", "parsing"] }
toml = "0.8.12"
toml_edit = "0.22.12"
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
ulid = { version = "1.1.2", features = ["serde"] }
walkdir = "2.5.0"
windows-sys = "0.52.0"
